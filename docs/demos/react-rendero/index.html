<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>React Native on Rendero</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        #info {
            position: fixed; top: 12px; left: 12px;
            background: rgba(0,0,0,0.75); color: #fff; padding: 10px 14px;
            border-radius: 8px; font: 12px/1.4 monospace; z-index: 10;
            pointer-events: none;
        }
        #info h3 { font-size: 14px; margin-bottom: 2px; color: #61dafb; }
        #info .step { color: #ffd700; font-size: 11px; }

        #ops-log {
            position: fixed; bottom: 12px; left: 12px;
            background: rgba(0,0,0,0.85); color: #0f0; padding: 10px 14px;
            border-radius: 8px; font: 10px/1.3 monospace; z-index: 10;
            max-width: 400px; max-height: 160px; overflow-y: auto;
            pointer-events: none;
        }
        #ops-log .op-create { color: #4ec9b0; }
        #ops-log .op-update { color: #dcdcaa; }
        #ops-log .op-remove { color: #f44747; }

        @media (max-width: 640px) {
            #info { top: 6px; left: 6px; padding: 6px 10px; font-size: 10px; }
            #info h3 { font-size: 12px; }
            #ops-log { font-size: 9px; max-height: 100px; left: 6px; bottom: 6px; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="info">
        <h3>React Native on Rendero</h3>
        <div id="step-label" class="step">loading...</div>
    </div>

    <div id="ops-log">
        <div style="color: #888; margin-bottom: 3px;">Reconciler Ops:</div>
        <div id="ops"></div>
    </div>

    <script type="module" src="app.js?v=yoga1"></script>
</body>
</html>
