<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rendero Layout Accuracy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; padding: 20px; }
        h1 { margin-bottom: 10px; }
        .summary { font-size: 24px; margin-bottom: 20px; }
        .pass { color: #34c759; }
        .fail { color: #ff3b30; }
        .test-result { margin-bottom: 8px; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-family: monospace; }
        .test-pass { background: #1a2e1a; }
        .test-fail { background: #2e1a1a; }
        .detail { color: #999; margin-left: 20px; }
        #container { position: absolute; top: -9999px; left: -9999px; visibility: hidden; }
    </style>
</head>
<body>
    <h1>Rendero Layout Accuracy</h1>
    <div class="summary" id="summary">Running...</div>
    <div id="results"></div>
    <div id="container"></div>

    <script type="module">
        import { CORPUS, VIEWPORT } from './test-corpus.js';
        import { installShim } from '../shims/index.js';

        const TOLERANCE = 1;
        const container = document.getElementById('container');
        const resultsDiv = document.getElementById('results');
        const summaryDiv = document.getElementById('summary');

        const engineCanvas = document.createElement('canvas');
        engineCanvas.width = VIEWPORT.width;
        engineCanvas.height = VIEWPORT.height;
        engineCanvas.style.position = 'absolute';
        engineCanvas.style.left = '-9999px';
        engineCanvas.style.top = '-9999px';
        engineCanvas.style.width = `${VIEWPORT.width}px`;
        engineCanvas.style.height = `${VIEWPORT.height}px`;
        document.body.appendChild(engineCanvas);

        const shim = await installShim(engineCanvas);
        const shimDoc = shim.document;
        const shimWindow = shim.window;

        function applyStyles(el, node) {
            if (!node.style) return;
            for (const [key, value] of Object.entries(node.style)) {
                el.style[key] = typeof value === 'number' ? `${value}px` : value;
            }
        }

        function buildTree(node, parent, doc, registry) {
            const el = doc.createElement(node.tag || 'div');
            if (node.id) {
                registry.set(node.id, el);
            }
            applyStyles(el, node);
            if (node.text) {
                el.textContent = node.text;
            }
            if (node.children) {
                for (const child of node.children) {
                    buildTree(child, el, doc, registry);
                }
            }
            parent.appendChild(el);
            return el;
        }

        function extractBrowserBounds(registry) {
            const bounds = {};
            const entries = Array.from(registry.entries());
            if (entries.length === 0) return bounds;
            const [, firstEl] = entries[0];
            const parentRect = firstEl.parentElement.getBoundingClientRect();
            for (const [id, el] of entries) {
                const r = el.getBoundingClientRect();
                bounds[id] = {
                    x: Math.round(r.left - parentRect.left),
                    y: Math.round(r.top - parentRect.top),
                    width: Math.round(r.width),
                    height: Math.round(r.height),
                };
            }
            return bounds;
        }

        function extractEngineBounds(registry) {
            const bounds = {};
            const entries = Array.from(registry.entries());
            if (entries.length === 0) return bounds;
            const [, firstEl] = entries[0];
            const origin = firstEl.getBoundingClientRect();
            for (const [id, el] of entries) {
                const r = el.getBoundingClientRect();
                bounds[id] = {
                    x: Math.round(r.left - origin.left),
                    y: Math.round(r.top - origin.top),
                    width: Math.round(r.width),
                    height: Math.round(r.height),
                };
            }
            return bounds;
        }

        function compareBounds(browserBounds, engineBounds) {
            const mismatches = [];
            for (const [id, browser] of Object.entries(browserBounds)) {
                const engine = engineBounds[id];
                if (!engine) {
                    mismatches.push(`${id}: missing in engine`);
                    continue;
                }
                for (const prop of ['x', 'y', 'width', 'height']) {
                    const diff = Math.abs((browser[prop] || 0) - (engine[prop] || 0));
                    if (diff >= TOLERANCE) {
                        mismatches.push(
                            `${id}.${prop}: browser=${browser[prop]} engine=${engine[prop]} diff=${diff}`
                        );
                    }
                }
            }
            for (const id of Object.keys(engineBounds)) {
                if (!(id in browserBounds)) {
                    mismatches.push(`${id}: extra engine node`);
                }
            }
            return mismatches;
        }

        function resetShimRoot() {
            while (shimDoc.body.childNodes.length > 0) {
                shimDoc.body.removeChild(shimDoc.body.childNodes[0]);
            }
        }

        function settleEngineFrames(frameCount = 4) {
            return new Promise((resolve) => {
                let remaining = frameCount;
                function tick() {
                    window.Rendero.engine.markDirty();
                    shimWindow.__renderoUpdateScrollMetrics?.();
                    if (--remaining <= 0) {
                        resolve();
                        return;
                    }
                    requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
            });
        }

        const results = [];
        let totalElements = 0;
        let totalProperties = 0;
        let propertyMatches = 0;
        let propertyMismatches = 0;

        for (const testCase of CORPUS) {
            const wrapper = document.createElement('div');
            wrapper.style.width = `${VIEWPORT.width}px`;
            wrapper.style.position = 'relative';
            container.appendChild(wrapper);

            const browserRegistry = new Map();
            buildTree(testCase.tree, wrapper, document, browserRegistry);
            wrapper.getBoundingClientRect();
            const browserBounds = extractBrowserBounds(browserRegistry);

            resetShimRoot();
            const engineRegistry = new Map();
            buildTree(testCase.tree, shimDoc.body, shimDoc, engineRegistry);
            await settleEngineFrames();
            const engineBounds = extractEngineBounds(engineRegistry);

            const mismatches = compareBounds(browserBounds, engineBounds);
            const elementCount = Object.keys(browserBounds).length;
            const propertyMismatchCount = mismatches.filter((m) => m.includes('.')).length;

            totalElements += elementCount;
            totalProperties += elementCount * 4;
            propertyMismatches += propertyMismatchCount;
            propertyMatches += Math.max(0, elementCount * 4 - propertyMismatchCount);

            results.push({
                label: testCase.label,
                category: testCase.category,
                elementCount,
                mismatchCount: mismatches.length,
                propertyMismatchCount,
                browserBounds,
                engineBounds,
                mismatches,
            });

            resetShimRoot();
            container.removeChild(wrapper);
        }

        let html = '';
        for (const result of results) {
            const pass = result.mismatchCount === 0;
            html += `<div class="test-result ${pass ? 'test-pass' : 'test-fail'}">`;
            html += `${pass ? '✓' : '✗'} [${result.category}] ${result.label} — ${result.elementCount} elements`;
            if (!pass) {
                for (const mismatch of result.mismatches.slice(0, 6)) {
                    html += `<div class="detail">${mismatch}</div>`;
                }
                if (result.mismatches.length > 6) {
                    html += `<div class="detail">... ${result.mismatches.length - 6} more</div>`;
                }
            }
            html += `</div>`;
        }
        resultsDiv.innerHTML = html;

        const pct = totalProperties > 0 ? ((propertyMatches / totalProperties) * 100).toFixed(1) : '0';
        summaryDiv.innerHTML =
            `<span class="${propertyMismatches === 0 ? 'pass' : 'fail'}">${propertyMatches}/${totalProperties} properties match (${pct}%)</span>` +
            ` — ${results.length} test cases, ${propertyMismatches} property mismatches`;

        const report = {
            status: 'ready',
            totalElements,
            totalProperties,
            propertyMatches,
            propertyMismatches,
            testCases: results.map((r) => ({
                label: r.label,
                category: r.category,
                elementCount: r.elementCount,
                mismatchCount: r.mismatchCount,
                propertyMismatchCount: r.propertyMismatchCount,
                mismatches: r.mismatches,
            })),
        };

        window.__LAYOUT_ACCURACY_REPORT__ = report;
        document.body.dataset.status = 'ready';

        const params = new URLSearchParams(location.search);
        if (params.get('report') === '1') {
            location.hash = '#report=' + encodeURIComponent(JSON.stringify(report));
        }
    </script>
</body>
</html>
